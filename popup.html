<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Support Toolkit</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<header>Support Toolkit</header>

<main>
    <div id="trackingDisabled" class="tracking-disabled hidden">
        <h3 data-i18n="trackingDisabled">Tracking disabled</h3>
        <p data-i18n="trackingDisabledHint">Enable tracking in settings to display metrics</p>
        <button id="openSettingsFromDisabled" data-i18n="openSettings">Open Settings</button>
    </div>

    <div id="trackingContent">
        <div class="kpi-card">
            <div class="kpi-label" data-i18n="repliesPerHour">Replies per Hour</div>
            <div id="rph" class="kpi-value">—</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-label" data-i18n="totalToday">Total Today</div>
            <div id="today" class="kpi-value">0</div>
        </div>

        <div class="kpi-card hidden" id="fraudTodayCard">
            <div class="kpi-label" data-i18n="fraudToday">Fraud Today</div>
            <div id="fraudToday" class="kpi-value">0</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-label" data-i18n="sinceStart">Since Start</div>
            <div id="sinceStart" class="kpi-value">0</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-label" data-i18n="duration">Duration</div>
            <div id="dur" class="kpi-value">—</div>
            <div id="since"></div>
        </div>

        <div class="buttons">
            <button id="pauseBtn" data-i18n="pause">Pause</button>
        </div>

        <button id="clearBtn" data-i18n="clear">Clear</button>
        <button id="openSettings" data-i18n="openSettings">Open Settings</button>

    </div>
</main>

<script src="i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
